# Include inside nginx http {}; use access_log /your/path/access.jsonl webloglens_json;
# site uses configured server_name, NOT the client-controlled Host/X-Forwarded-For.
log_format webloglens_json escape=json
    '{"schema":"webloglens-nginx-1",'
    '"time":"$time_iso8601",'
    '"ip":"$remote_addr",'
    '"method":"$request_method",'
    '"target":"$request_uri",'
    '"protocol":"$server_protocol",'
    '"status":$status,'
    '"body_bytes":$body_bytes_sent,'
    '"site":"$server_name",'
    '"request_time":$request_time,'
    '"request_id":"$request_id",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"}';
